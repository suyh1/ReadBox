name: 四端构建与发布
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: readbox-build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run build
      - run: python3 scripts/release.py notes
      - if: startsWith(github.ref, 'refs/tags/')
        run: python3 scripts/release.py notes --tag "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: shared-ui
          path: dist/
          if-no-files-found: error

  desktop:
    needs: ui
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: win32
            arch: x64
            target: windows-x64
            suffix: exe
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
            target: linux-amd64
            suffix: deb
          - runner: ubuntu-22.04-arm
            platform: linux
            arch: arm64
            target: linux-arm64
            suffix: deb
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - uses: actions/download-artifact@v4
        with:
          name: shared-ui
          path: dist
      - run: npm run package:desktop -- ${{ matrix.platform }} ${{ matrix.arch }}
      - name: 安装 DEB 并以普通用户启动
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth
          package=$(ls out/*.deb)
          test "$(dpkg-deb -f "$package" Architecture)" = "$(dpkg --print-architecture)"
          if dpkg-deb -f "$package" Depends | grep -qi webkit; then exit 1; fi
          sudo apt-get install -y "./$package"
          test "$(stat -c '%u:%g %a' /opt/readbox/chrome-sandbox)" = '0:0 4755'
          xvfb-run -a node scripts/smoke-desktop.mjs /opt/readbox/readbox
      - name: 安装 NSIS 并启动
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem out/*.exe).FullName
          $destination = Join-Path $env:RUNNER_TEMP ReadBox
          $process = Start-Process $installer -ArgumentList "/S","/D=$destination" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS 安装失败" }
          node scripts/smoke-desktop.mjs "$destination/readbox.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: out/*.${{ matrix.suffix }}
          if-no-files-found: error

  android:
    needs: ui
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: shared-ui
          path: dist
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" "build-tools;36.0.0"'
      - name: 构建调试 APK
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: ./android/gradlew -p android :app:assembleDebug
      - name: 构建正式签名 APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          READBOX_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          READBOX_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          READBOX_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          : "${KEYSTORE_BASE64:?缺少发布密钥}" "${READBOX_STORE_PASSWORD:?缺少密钥库口令}" "${READBOX_KEY_ALIAS:?缺少别名}" "${READBOX_KEY_PASSWORD:?缺少密钥口令}"
          umask 077
          export READBOX_KEYSTORE="$RUNNER_TEMP/readbox.jks"
          trap 'rm -f "$READBOX_KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$READBOX_KEYSTORE"
          ./android/gradlew -p android :app:assembleRelease
      - name: 验证签名、内置引擎与启动资源
        run: |
          version=$(jq -r .version package.json)
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p out
          for abi in arm64-v8a armeabi-v7a x86_64; do
            apks=(android/app/build/outputs/apk/*/app-"$abi"-*.apk)
            test "${#apks[@]}" -eq 1
            apk=${apks[0]}
            "$build_tools/apksigner" verify "$apk"
            "$build_tools/aapt" dump badging "$apk" | grep -Fx "native-code: '$abi'"
            unzip -Z1 "$apk" > "$RUNNER_TEMP/apk-files.txt"
            grep -Fx "lib/$abi/libxul.so" "$RUNNER_TEMP/apk-files.txt"
            grep -Fx 'assets/ui/index.html' "$RUNNER_TEMP/apk-files.txt"
            grep -Fx 'assets/ui/manifest.json' "$RUNNER_TEMP/apk-files.txt"
            bytes=$(stat -c %s "$apk")
            echo "$abi APK: $bytes bytes" | tee -a "$GITHUB_STEP_SUMMARY"
            cp "$apk" "out/ReadBox-$version-android-$abi.apk"
          done
      - name: 启用 Android 模拟器加速
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 离线冷启动
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: bash scripts/smoke-android.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-reader-diagnostics
          path: out/android-reader-failure.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: package-android-arm64-v8a
          path: out/*-android-arm64-v8a.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: package-android-armeabi-v7a
          path: out/*-android-armeabi-v7a.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: package-android-x86_64
          path: out/*-android-x86_64.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [desktop, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency: release-${{ github.ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: artifacts
      - name: 生成中文更新说明和校验值
        run: python3 scripts/release.py prepare --tag "$GITHUB_REF_NAME" --assets artifacts > "$RUNNER_TEMP/notes.md"
      - name: 上传全部产物并发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft); then
            test "$draft" = true || { echo "此版本已经发布"; exit 1; }
          else
            gh release create "$tag" --verify-tag --draft --title "ReadBox ${tag#v}" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload "$tag" artifacts/* --clobber
          gh release edit "$tag" --notes-file "$RUNNER_TEMP/notes.md" --draft=false
